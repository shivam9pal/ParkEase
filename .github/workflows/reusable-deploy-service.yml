name: Reusable Deploy Service to EC2

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_port:
        required: true
        type: string
      service_dir:
        required: true
        type: string
    secrets:
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_PRIVATE_KEY:
        required: true
      GHCR_TOKEN:
        required: true
      YOUR_GITHUB_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          mvn clean package -f ${{ inputs.service_dir }}/pom.xml -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shivam9pal
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/shivam9pal/parkease-${{ inputs.service_name }}:latest \
            -t ghcr.io/shivam9pal/parkease-${{ inputs.service_name }}:${{ github.sha }} \
            ${{ inputs.service_dir }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/shivam9pal/parkease-${{ inputs.service_name }}:latest
          docker push ghcr.io/shivam9pal/parkease-${{ inputs.service_name }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/parkease

            # Pull latest image
            docker compose pull ${{ inputs.service_name }}

            # Restart only this service
            docker compose up -d --no-deps ${{ inputs.service_name }}

            # Wait for it to start
            sleep 10

            # Health check
            if curl -sf http://localhost:${{ inputs.service_port }}/actuator/health > /dev/null 2>&1; then
              echo "✅ ${{ inputs.service_name }} healthy on port ${{ inputs.service_port }}"
            else
              echo "⚠️ ${{ inputs.service_name }} started — health check pending"
            fi

      - name: Deployment Summary
        run: |
          echo "✅ ${{ inputs.service_name }} deployed!"
          echo "Image: ghcr.io/shivam9pal/parkease-${{ inputs.service_name }}:latest"
          echo "SHA tag: ${{ github.sha }}"