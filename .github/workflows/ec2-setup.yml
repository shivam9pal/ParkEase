name: EC2 Initial Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup EC2 directories and Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "====== Creating directories ======"
            mkdir -p ~/services ~/logs ~/pids ~/frontends/{admin,driver,manager} ~/config
            chmod -R 755 ~/
            
            echo "====== Updating system ======"
            sudo apt-get update
            
            echo "====== Installing Java 17 ======"
            sudo apt-get install -y openjdk-17-jdk-headless
            java -version
            
            echo "====== Installing Docker (if not exists) ======"
            which docker || (sudo apt-get install -y docker.io && sudo usermod -aG docker $USER)
            
            echo "====== Installing Docker Compose ======"
            which docker-compose || (sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && sudo chmod +x /usr/local/bin/docker-compose)
            
            echo "====== Setting up RabbitMQ in Docker ======"
            mkdir -p ~/rabbitmq/data ~/rabbitmq/logs
            
            # Check if RabbitMQ container already exists
            if docker ps -a | grep -q parkease-rabbitmq; then
              echo "RabbitMQ container already exists"
              docker start parkease-rabbitmq || true
            else
              echo "Starting new RabbitMQ container..."
              docker run -d \
                --name parkease-rabbitmq \
                -p 5672:5672 \
                -p 15672:15672 \
                -v ~/rabbitmq/data:/var/lib/rabbitmq \
                -v ~/rabbitmq/logs:/var/log/rabbitmq \
                -e RABBITMQ_DEFAULT_USER=guest \
                -e RABBITMQ_DEFAULT_PASS=guest \
                --restart unless-stopped \
                rabbitmq:3.12-management
              
              echo "Waiting for RabbitMQ to be ready..."
              sleep 10
            fi
            
            echo "====== Verification ======"
            echo "Java version:"
            java -version
            echo "Docker version:"
            docker --version
            echo "Directory structure:"
            ls -la ~/
            echo "RabbitMQ status:"
            docker ps | grep rabbitmq || echo "RabbitMQ not running"
            
            echo "====== EC2 Setup Complete! ======"
            echo "Services will start on these ports:"
            echo "  eurekaserver:           8761"
            echo "  config-service:         8888"
            echo "  api-gateway:            8080"
            echo "  auth-service:           8081"
            echo "  parkinglot-service:     8082"
            echo "  spot-service:           8083"
            echo "  booking-service:        8084"
            echo "  payment-service:        8085"
            echo "  vehicle-service:        8086"
            echo "  notification-service:   8087"
            echo "  media-service:          8090"
            echo "  analytics-service:      8088"
            echo ""
            echo "RabbitMQ:"
            echo "  AMQP:          5672"
            echo "  Management UI: 15672 (http://localhost:15672, user: guest, pass: guest)"
