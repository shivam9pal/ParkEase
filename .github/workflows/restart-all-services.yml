name: Restart All Services

on:
  workflow_dispatch:

jobs:
  restart-all:
    runs-on: ubuntu-latest
    steps:
      - name: Restart all Java services on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "====== Stopping all services ======"
            pkill -f "java.*jar" || echo "No Java services to stop"
            sleep 3
            
            echo "====== Restarting services ======"
            mkdir -p ~/pids
            
            SERVICES=(
              "eurekaserver:8761"
              "config-service:8888"
              "apigateway:8080"
              "auth-service:8081"
              "parkinglot-service:8082"
              "spot-service:8083"
              "booking-service:8084"
              "payment-service:8085"
              "vehicle-service:8086"
              "notification-service:8087"
              "analytics-service:8088"
              "media-service:8090"
            )
            
            for service_port in "${SERVICES[@]}"; do
              IFS=':' read -r SERVICE PORT <<< "$service_port"
              if [ -f ~/services/$SERVICE.jar ]; then
                echo "Starting $SERVICE on port $PORT..."
                nohup java -jar ~/services/$SERVICE.jar \
                  --server.port=$PORT \
                  > ~/logs/$SERVICE.log 2>&1 &
                PID=$!
                echo "$PID" > ~/pids/$SERVICE.pid
                echo "✓ Started with PID: $PID"
              else
                echo "✗ JAR not found: ~/services/$SERVICE.jar"
              fi
            done
            
            echo ""
            echo "====== Waiting for services to start ======"
            sleep 10
            
            echo "====== Verifying services ======"
            for service_port in "${SERVICES[@]}"; do
              IFS=':' read -r SERVICE PORT <<< "$service_port"
              if nc -z localhost $PORT 2>/dev/null; then
                echo "✓ $SERVICE (port $PORT) - RUNNING"
              else
                echo "✗ $SERVICE (port $PORT) - Not responding yet"
              fi
            done
