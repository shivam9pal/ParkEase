name: EC2 Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 Services Health
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "====== System Health Check ======"
            echo ""
            echo "Date: $(date)"
            echo "Uptime:"
            uptime
            echo ""
            
            echo "====== Java Services Status ======"
            ps aux | grep java | grep -v grep || echo "No Java services running"
            echo ""
            
            echo "====== Docker Status ======"
            docker ps --format "table {{.Names}}\t{{.Status}}"
            echo ""
            
            echo "====== Port Availability ======"
            for port in 8761 8888 8080 8081 8082 8083 8084 8085 8086 8087 8088 8089 5672; do
              if nc -z localhost $port 2>/dev/null; then
                echo "✓ Port $port: OPEN"
              else
                echo "✗ Port $port: CLOSED"
              fi
            done
            echo ""
            
            echo "====== Disk Usage ======"
            df -h | head -n 2
            echo ""
            
            echo "====== Memory Usage ======"
            free -h | head -n 2
            echo ""
            
            echo "====== Recent Logs (last 20 lines) ======"
            for log in ~/logs/*.log; do
              if [ -f "$log" ]; then
                SERVICE=$(basename "$log" .log)
                echo ""
                echo "--- $SERVICE ---"
                tail -5 "$log" 2>/dev/null || echo "(No logs yet)"
              fi
            done
