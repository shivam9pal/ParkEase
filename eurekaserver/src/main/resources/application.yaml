server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eurekaserver              # ← was localhost, use container name
  client:
    register-with-eureka: false         # server doesn't register with itself
    fetch-registry: false
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always